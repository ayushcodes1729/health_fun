# Explicit per-package decision on native build scripts (pnpm 11 refuses to
# run any without one). sharp/unrs-resolver are Next.js accelerators;
# bufferutil/utf-8-validate/bigint-buffer speed up web3.js. Ledger USB,
# Stellar and the rest are transitive deps of wallet adapters we don't use.
allowBuilds:
  '@stellar/stellar-sdk': false
  bigint-buffer: true
  blake-hash: false
  bufferutil: true
  esbuild: set this to true or false
  protobufjs: false
  sharp: true
  tiny-secp256k1: false
  unrs-resolver: true
  usb: false
  utf-8-validate: true

# drizzle-kit declares no dependency on drizzle-orm or the postgres driver; it
# expects to find them by walking up from its own location. With the package
# store symlinked outside the project (see next.config.ts) that walk fails.
# Declaring them as peers makes pnpm link both next to drizzle-kit itself.
packageExtensions:
  drizzle-kit:
    peerDependencies:
      drizzle-orm: '*'
      postgres: '*'
