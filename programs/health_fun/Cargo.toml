[package]
name = "health_fun"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "health_fun"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
# init-if-needed lets `stake` create the user's profile on their first challenge
# instead of requiring a separate setup transaction. Safe here: the profile PDA
# has fixed seeds and `init_stake` only writes its fields when it is new.
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
solana-program = "4.0.0"


[lints.rust]
unexpected_cfgs = "warn"
